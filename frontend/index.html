<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillParity — Industry–Curriculum Intelligence Platform</title>
  
  <!-- Premium Editorial Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Chart.js Engine -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Warm Editorial Neutral Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Minimal Top Navigation System -->
  <header class="app-header">
    <div class="top-bar">
      <!-- Minimal Geometric Brand Identity -->
      <div class="brand-container" id="btn-home">
        <div class="brand-logo-mark">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="16" r="8" stroke="#3478D4" stroke-width="3"/>
            <circle cx="20" cy="16" r="8" stroke="#28A9A1" stroke-width="3"/>
          </svg>
        </div>
        <div class="brand-title">SkillParity</div>
      </div>

      <!-- Top Navigation Links -->
      <nav class="top-nav" id="top-nav-links">
        <!-- Rendered dynamically via app.js -->
      </nav>

      <!-- Global Controls & Auth -->
      <div class="header-controls">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search-input" class="search-input" placeholder="Search skills, roles..." autocomplete="off">
          <div id="search-results-popup" class="search-results-popup" style="display: none;"></div>
        </div>

        <div class="role-badge-selector" id="btn-role-switcher" title="Switch active workspace">
          <span class="role-dot landing" id="active-role-dot"></span>
          <span id="active-role-label" style="font-weight: 600;">Guest</span>
          <span style="font-size: 0.7rem; opacity: 0.6;">▼</span>
        </div>

        <div id="auth-actions">
          <button class="btn btn-outline btn-sm" id="btn-open-login">Sign In</button>
        </div>
      </div>
    </div>

    <!-- Secondary Contextual Sub-Nav Bar (Active in Workspaces) -->
    <div class="sub-nav-bar" id="sub-nav-bar" style="display: none;">
      <div class="sub-nav-container" id="sub-nav-links">
        <!-- Contextual tabs rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-container" id="app-view">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Editorial Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <div>
        <strong style="font-family: var(--font-display); letter-spacing: -0.02em; color: var(--text-main);">SKILLPARITY INTELLIGENCE PLATFORM</strong>
        <p style="margin-top: 0.25rem; font-size: 0.8rem; color: var(--text-muted);">
          Bringing Higher Education into Parity with Industry Demand
        </p>
      </div>
      <div>
        <span class="status-indicator-badge">REST API Online &bull; SQLite Persistence</span>
      </div>
    </div>
  </footer>

  <!-- Modal Backdrop for Auth & Role Selector -->
  <div class="modal-backdrop" id="modal-container" style="display: none;">
    <div class="modal-content" id="modal-body">
      <!-- Rendered dynamically -->
    </div>
  </div>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
